<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаб 5 - Варіант 10</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">
        <h2>Форма (Варіант 10)</h2>
        <form id="myForm">
            <div class="form-group">
                <label for="pib">ПІБ:</label>
                <input type="text" id="pib" placeholder="Іванов І.І.">
            </div>
            <div class="form-group">
                <label for="group">Група:</label>
                <input type="text" id="group" placeholder="ІТ-44">
            </div>
            <div class="form-group">
                <label for="phone">Телефон:</label>
                <input type="text" id="phone" placeholder="(099)-123-456-789">
            </div>
            <div class="form-group">
                <label for="dob">Дата народження:</label>
                <input type="text" id="dob" placeholder="13.09.2006">
            </div>
            <div class="form-group">
                <label for="address">Адреса:</label>
                <input type="text" id="address" placeholder="м. Київ, вул. Хрещатик">
            </div>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="text" id="email" placeholder="example@mail.com">
            </div>
            <button type="submit">Підтвердити</button>
        </form>
    </div>

    <div class="table-container">
        <h2>Таблиця 6x6 (Варіант 10)</h2>
        <div class="color-picker-container">
            <label for="colorPicker">Оберіть колір для кліку: </label>
            <input type="color" id="colorPicker" value="#ff0000">
        </div>
        <table id="gridTable">
        </table>
    </div>

    <script src="script.js"></script>
</body>

</html>
